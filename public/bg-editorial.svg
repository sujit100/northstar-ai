<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAF8"/>
      <stop offset="55%" stop-color="#F6F0E6"/>
      <stop offset="100%" stop-color="#EFE3D2"/>
    </linearGradient>
    <radialGradient id="bg-glow-tl" cx="0%" cy="0%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-warm-br" cx="100%" cy="100%" r="65%">
      <stop offset="0%" stop-color="#C2410C" stop-opacity="0.08"/>
      <stop offset="55%" stop-color="#C2410C" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#C2410C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="bg-dots" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="0.8" fill="#0A0A0A" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg-base)"/>
  <rect width="1920" height="1080" fill="url(#bg-dots)"/>
  <rect width="1920" height="1080" fill="url(#bg-glow-tl)"/>
  <rect width="1920" height="1080" fill="url(#bg-warm-br)"/>

  <g fill="#C2410C">
    <circle cx="220" cy="280" r="3" fill-opacity="0.18"/>
    <circle cx="1640" cy="360" r="3" fill-opacity="0.20"/>
    <circle cx="340" cy="820" r="2.5" fill-opacity="0.15"/>
    <circle cx="1480" cy="900" r="3" fill-opacity="0.18"/>
    <circle cx="960" cy="180" r="2" fill-opacity="0.12"/>
    <circle cx="800" cy="720" r="2.5" fill-opacity="0.16"/>
    <circle cx="1180" cy="520" r="2" fill-opacity="0.14"/>
  </g>
</svg>
